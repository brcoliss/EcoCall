
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoCall — Avaliações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  
  <!-- CSS estruturado e modularizado na ordem correta -->
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/ecocall-dashboard.css">
  <link rel="stylesheet" href="css/empresa-pages.css">
</head>
<body class="dash-page"> <!-- Injetada a classe para herdar o fundo do Painel -->

  <!-- Tela de Carregamento Global -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-spinner"></div>
    <p>Carregando avaliações...</p>
  </div>

  <div class="dash-layout">

    <!-- ─── SIDEBAR LATERAL ─── -->
    <aside class="sidebar">
      <a href="dashboard_empresa.html" class="logo" onclick="transicaoPara('dashboard_empresa.html', event)">
        <img
          src="img/logo-folha.png"
          alt="EcoCall"
          class="logo-leaf"
          width="70"
          height="70"
          style="width:70px;height:70px;object-fit:contain;display:block;flex-shrink:0;"
        >
        <div class="logo-stack" style="display:flex;flex-direction:column;justify-content:center;line-height:1.05;">
          <div class="logo-name">EcoCall</div>
          <div class="logo-tag">Painel Empresa</div>
        </div>
      </a>

      <nav class="sidebar-menu">
        <a href="dashboard_empresa.html" class="nav-item" onclick="transicaoPara('dashboard_empresa.html', event)">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Painel</span>
        </a>
        <a href="pedidos.html" class="nav-item" onclick="transicaoPara('pedidos.html', event)">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>Pedidos <b class="badge-count"></b></span>
        </a>
        <a href="agendamentos.html" class="nav-item" onclick="transicaoPara('agendamentos.html', event)">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Agendamentos</span>
        </a>
        <a href="relatorios.html" class="nav-item" onclick="transicaoPara('relatorios.html', event)">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Relatórios</span>
        </a>
        <a href="meu-perfil.html" class="nav-item" onclick="transicaoPara('meu-perfil.html', event)">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Meu Perfil</span>
        </a>
        <a href="avaliacoes.html" class="nav-item active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>Avaliações</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="avatar-mini avatar-mini--brand"></div>
        <div class="user-meta">
          <div class="user-name"></div>
          <div class="user-email"></div>
        </div>
        <a href="#" class="logout-trigger" onclick="logout(event)" title="Sair do painel">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </a>
      </div>
    </aside>

    <!-- ─── CONTEÚDO PRINCIPAL ─── -->
    <main class="main-content">

      <header class="topbar">
        <div class="topbar-welcome">
          <h1>Avaliações</h1>
          <p>Veja o que os clients dizem sobre o atendimento da sua empresa.</p>
        </div>
        <div class="topbar-right">
          <select class="select-input" onchange="filterReviews(this.value)">
            <option value="all">Todas</option>
            <option value="5">5 estrelas</option>
            <option value="4">4 estrelas</option>
            <option value="3">3 estrelas</option>
            <option value="low">2 ou menos</option>
          </select>
        </div>
      </header>

      <div class="content-wrapper">

        <!-- Bloco de Resumo Estatístico -->
        <div class="content-card">
          <div class="review-summary">
            <div class="review-big">
              <div class="review-num"></div>
              <div class="review-stars-big">★ ★ ★ ★ ★</div>
              <div class="review-total"></div>
            </div>
            <!-- Estilos inline substituídos pelos seletores data-fill do seu shared.css -->
            <div class="review-bars">
              <div class="rb-row"><span>5 ★</span><div class="rb-track"><div class="rb-fill" data-fill="0"></div></div><span></span></div>
              <div class="rb-row"><span>4 ★</span><div class="rb-track"><div class="rb-fill" data-fill="0"></div></div><span></span></div>
              <div class="rb-row"><span>3 ★</span><div class="rb-track"><div class="rb-fill" data-fill="0"></div></div><span></span></div>
              <div class="rb-row"><span>2 ★</span><div class="rb-track"><div class="rb-fill" data-fill="0"></div></div><span></span></div>
              <div class="rb-row"><span>1 ★</span><div class="rb-track"><div class="rb-fill" data-fill="0"></div></div><span></span></div>
            </div>
          </div>
        </div>

        <!-- Lista de Avaliações Crueis / Elogios -->
        <div class="review-list" id="review-list">

        </div>

      </div>
    </main>
  </div>

  <!-- Componente flutuante do Toast Notification -->
  <div class="toast" id="tst"><div class="tdot"></div><span id="tmsg"></span></div>

  <!-- Scripts -->
  <script src="js/core.js"></script>
  <script src="js/avaliacoes.js"></script>
</body>
</html>
