<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoCall — Meu Perfil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/ecocall-dashboard.css">
  <link rel="stylesheet" href="css/empresa-pages.css">
</head>
<body>
  <div id="loading-screen" class="loading-screen">
    <div class="loading-spinner"></div>
    <p>Carregando perfil...</p>
  </div>

  <div class="dash-layout">
    <aside class="sidebar">
      <a href="dashboard_empresa.html" class="logo" onclick="transicaoPara('dashboard_empresa.html', event)">
        <div class="logo-mark"><img src="img/logo-folha.png" alt="EcoCall" width="36" height="36"></div>
        <div><div class="logo-name">EcoCall</div><div class="logo-tag">Painel Empresa</div></div>
      </a>

      <nav class="sidebar-menu">
        <a href="dashboard_empresa.html" class="nav-item" onclick="transicaoPara('dashboard_empresa.html', event)">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Painel</span>
        </a>
        <a href="pedidos.html" class="nav-item" onclick="transicaoPara('pedidos.html', event)">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>Pedidos <b class="badge-count"></b></span>
        </a>
        <a href="agendamentos.html" class="nav-item" onclick="transicaoPara('agendamentos.html', event)">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Agendamentos</span>
        </a>
        <a href="relatorios.html" class="nav-item" onclick="transicaoPara('relatorios.html', event)">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Relatórios</span>
        </a>
        <a href="meu-perfil.html" class="nav-item active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Meu Perfil</span>
        </a>
        <a href="avaliacoes.html" class="nav-item" onclick="transicaoPara('avaliacoes.html', event)">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>Avaliações</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="avatar-mini avatar-mini--brand"></div>
        <div class="user-meta">
          <div class="user-name"></div>
          <div class="user-email"></div>
        </div>
        <a href="javascript:void(0)" class="logout-trigger" onclick="logout(event)" title="Sair do painel">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </a>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-welcome">
          <h1>Meu Perfil</h1>
          <p>Mantenha as informações da empresa atualizadas para aparecer no mapa.</p>
        </div>
        <div class="topbar-right">
          <div class="user-location-badge" style="background:rgba(62,201,106,.1);border-color:rgba(62,201,106,.3);">
            <span style="color:#3ec96a;margin-right:4px;">●</span>
            <span style="color:var(--text-dark);">Visível no mapa</span>
          </div>
        </div>
      </header>

      <div class="content-wrapper">
        <div class="profile-grid">
          <div class="profile-side-card">
            <div class="profile-pic"></div>
            <h3></h3>
            <p></p>
            <button class="profile-pic-btn" onclick="toast('Abrindo seletor de imagem…')">Trocar foto</button>

            <div style="margin-top:1.6rem;text-align:left;display:flex;flex-direction:column;gap:.65rem;">
              <div style="display:flex;justify-content:space-between;font-size:.84rem;">
                <span style="color:var(--text-grey);">Coletas realizadas</span><strong></strong>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:.84rem;">
                <span style="color:var(--text-grey);">Avaliação</span><strong></strong>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:.84rem;">
                <span style="color:var(--text-grey);">Membro desde</span><strong></strong>
              </div>
            </div>
          </div>

          <div class="profile-form-card">
            <h2 style="font-family:var(--font-syne);font-size:1.15rem;margin-bottom:1.2rem;">Dados da empresa</h2>
            <form onsubmit="event.preventDefault();toast('Alterações salvas com sucesso.');">
              <div class="form-row">
                <div class="form-field"><label>Razão social</label><input type="text" value=""></div>
                <div class="form-field"><label>Nome fantasia</label><input type="text" value=""></div>
              </div>
              <div class="form-row">
                <div class="form-field"><label>CNPJ</label><input type="text" value=""></div>
                <div class="form-field"><label>Telefone</label><input type="text" value=""></div>
              </div>
              <div class="form-row">
                <div class="form-field"><label>Email</label><input type="email" value=""></div>
                <div class="form-field"><label>Site</label><input type="text" value=""></div>
              </div>
              <div class="form-row">
                <div class="form-field"><label>Cidade</label><input type="text" value=""></div>
                <div class="form-field">
                  <label>Raio de atuação</label>
                  <select>
                    <option value="">Selecione</option>
                    <option>5 km</option><option>15 km</option><option>30 km</option><option>50 km</option>
                  </select>
                </div>
              </div>
              <div class="form-field" style="margin-bottom:1rem;">
                <label>Endereço completo</label><input type="text" value="">
              </div>
              <div class="form-field" style="margin-bottom:1rem;">
                <label>Tipos de resíduo aceitos</label>
                <div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.3rem;">
                  <button type="button" class="profile-pic-btn" style="padding:2px 12px;font-size:.78rem;margin:0;" onclick="toast('Abrindo seleção de tipos…')">+ Editar</button>
                </div>
              </div>
              <div class="form-field" style="margin-bottom:1rem;">
                <label>Sobre a empresa</label><textarea style="resize:vertical;"></textarea>
              </div>
              <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="toast('Alterações descartadas.')">Cancelar</button>
                <button type="submit" class="btn-save">Salvar alterações</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"><div class="tdot"></div><span id="tmsg"></span></div>
  <script src="js/core.js"></script>
</body>
</html>
